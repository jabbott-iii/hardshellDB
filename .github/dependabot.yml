version: 2
updates:
  # GitHub Actions only, as roadmap task M0.8 says: hardshellDB has no
  # third-party crates to update, and a person chooses each toolchain bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a broken or
    # malicious release has time to be found and pulled. Security updates
    # aren't delayed.
    cooldown:
      default-days: 7
    # Minor and patch updates share one pull request; each major update
    # arrives on its own, because a new major version may change the API.
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
